services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akwabafoncier_db
      POSTGRES_USER: akwaba_user
      POSTGRES_PASSWORD: akwaba_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akwaba_user -d akwabafoncier_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key-do-not-use-in-production-0000000000}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: akwabafoncier_db
      DB_USER: akwaba_user
      DB_PASSWORD: akwaba_pass
      DB_HOST: db
      DB_PORT: 5432
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_NOTIFY_URL: ${CINETPAY_NOTIFY_URL:-}
      CINETPAY_RETURN_URL: ${CINETPAY_RETURN_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
