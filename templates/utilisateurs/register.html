{% extends 'base.html' %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:500px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <h1 style="font-size:1.75rem;font-weight:800;">Créer un compte</h1>
      <p style="color:var(--gray-500);margin-top:0.375rem;">Rejoignez AkwabaFoncier gratuitement</p>
    </div>
    <div class="card" style="box-shadow:var(--shadow-lg);">
      <form method="post">
        {% csrf_token %}
        <div class="grid-2" style="gap:1rem;">
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input type="text" name="first_name" class="form-control" placeholder="Jean" required>
          </div>
          <div class="form-group">
            <label class="form-label">Nom</label>
            <input type="text" name="last_name" class="form-control" placeholder="Konan" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Nom d'utilisateur</label>
          <input type="text" name="username" class="form-control" placeholder="jean_konan" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="jean@exemple.ci" required>
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input type="tel" name="telephone" class="form-control" placeholder="+225 07 00 00 00 00">
        </div>
        <div class="form-group">
          <label class="form-label">Type de compte</label>
          <select name="role" class="form-control">
            <option value="citoyen">Citoyen</option>
            <option value="professionnel">Professionnel (notaire, agent immo...)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control" placeholder="Minimum 8 caractères" required>
        </div>
        <button type="submit" class="btn btn-primary w-full">Créer mon compte</button>
      </form>
      <div class="divider"></div>
      <p style="text-align:center;font-size:0.875rem;color:var(--gray-500);">Déjà un compte ? <a href="/auth/login/" style="font-weight:600;">Se connecter</a></p>
    </div>
  </div>
</div>
{% endblock %}
