{% extends 'base_dashboard.html' %}
{% block title %}Services{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">💳 Nos services</h1></div>
<div class="grid-3" style="gap:1rem;max-width:1000px;">
  {% for t in tarifs %}
  <div class="card" style="text-align:center;">
    <div style="font-weight:700;margin-bottom:0.375rem;">{{ t.get_service_display }}</div>
    <div style="font-family:var(--font-heading);font-size:1.5rem;font-weight:800;color:var(--orange);margin-bottom:0.5rem;">{{ t.prix|floatformat:0 }} FCFA</div>
    <p style="font-size:0.8125rem;color:var(--gray-500);margin-bottom:1rem;">{{ t.description }}</p>
    <a href="/paiements/payer/?service={{ t.service }}" class="btn btn-primary btn-sm w-full">Commander</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
